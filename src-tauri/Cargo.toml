[package]
name = "job-application-tracker"
version = "2.0.0"
default-run = "job-application-tracker"
description = "A private, local-first job application tracker"
authors = ["JobTrack"]
edition = "2021"

[lib]
name = "job_application_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["clock"] }
csv = "1"
tauri-plugin-notification = "2"
rfd = "0.15"
zip = "2.2"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
mailparse = "0.15"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
